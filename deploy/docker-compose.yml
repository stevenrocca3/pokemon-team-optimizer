# DexPresso on one server (Oracle Cloud Always Free, ARM): the app, its Postgres, Caddy for HTTPS, and the battle
# analysis service (its API, a worker, and Redis between them).
# On the server:  cd deploy && docker compose up -d --build
# Secrets live in deploy/.env (copy .env.example), which git ignores.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dexpresso
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d dexpresso"]
      interval: 5s
      timeout: 5s
      retries: 20
    # no ports: only the app reaches it, over Compose's private network

  app:
    build:
      context: ..
      args:
        VITE_GOATCOUNTER_URL: ${VITE_GOATCOUNTER_URL:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/dexpresso
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      # Caddy puts the visitor's real IP here; rate limits are per IP
      APP_CLIENT_IP_HEADER: X-Real-IP
      # battle history: finished analyses are fetched from the analysis service over the private network
      APP_ANALYSIS_URL: http://analysis-api:8090
    # no ports: Caddy is the only way in

  # the job queue and job status for battle analysis; append-only, so queued jobs survive a restart
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # uploads, status and the progress stream; Caddy sends /api/v1/analyze* here
  analysis-api:
    build:
      context: ..
      dockerfile: battle-analysis/Dockerfile
    image: dexpresso-analysis
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /uploads
      MAX_UPLOAD_MB: ${ANALYSIS_MAX_UPLOAD_MB:-400}
      UPLOADS_PER_HOUR: ${ANALYSIS_UPLOADS_PER_HOUR:-6}
    volumes:
      - uploads:/uploads   # shared with the worker, which deletes each video once it's read

  # reads the videos: one at a time (CV is CPU-heavy), so a busy hour queues instead of starving the app
  analysis-worker:
    build:
      context: ..
      dockerfile: battle-analysis/Dockerfile
    # no image: name here: two services building one tag in parallel fail with "already exists". This builds
    # under its own name from the API's cached layers, so it costs no extra time or disk.
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["celery", "-A", "battle_analysis.service.tasks", "worker", "--concurrency", "1", "--loglevel", "INFO"]
    environment:
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /uploads
    volumes:
      - uploads:/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
      - analysis-api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      # the folder, not the file: git pull replaces the Caddyfile, and a single-file mount keeps showing the old
      # one. Caddy still only reads it at start, so a deploy recreates this container (docs/DEPLOY.md).
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data   # the HTTPS certificates; keep this volume or Caddy re-requests them
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  redisdata:
  uploads:
