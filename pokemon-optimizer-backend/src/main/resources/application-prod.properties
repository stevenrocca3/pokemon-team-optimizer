# Production (SPRING_PROFILES_ACTIVE=prod, set by the Dockerfile). Everything secret comes from the host's
# environment: DATABASE_URL (jdbc:postgresql://host:5432/db), DB_USER, DB_PASSWORD, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
spring.datasource.url=${DATABASE_URL}
spring.jpa.show-sql=false
# hosts pass the port in $PORT
server.port=${PORT:8080}
# behind the host's HTTPS proxy: build redirect URLs (Google login) from X-Forwarded-* so they say https
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
# the React app is served from this same origin
app.after-login-url=/
