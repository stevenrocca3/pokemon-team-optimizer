spring.application.name=pokemon-optimizer-backend
spring.datasource.url=jdbc:postgresql://localhost:5432/dexpresso
spring.config.import=optional:file:.env[.properties]
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# Flyway owns the schema (resources/db/migration); Hibernate only checks the entities still match it.
spring.jpa.hibernate.ddl-auto=validate
# a database made by the old ddl-auto=update already has V1's tables: mark it as V1 instead of failing
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true
spring.web.error.include-stacktrace=never
server.port=8081
# development: login lands back on the Vite dev server (production overrides this in application-prod.properties)
app.after-login-url=http://localhost:5173/
server.compression.enabled=true
# Poké Genie exports run ~1.2 MB for 5,000 Pokémon
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# uptime monitoring polls /actuator/health (UP needs the database too); nothing else is exposed, and no details
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# imports save thousands of Pokémon: send INSERTs 50 per round trip (ids come from caught_pokemon_seq)
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
